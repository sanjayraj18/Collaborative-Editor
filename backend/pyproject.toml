[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.12",
    "pycrdt>=0.14.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated. Linting them creates churn every time you run alembic.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — unused imports, undefined names
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear — mutable defaults, bare except, loop-variable capture
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # blocking calls inside async def — earns its keep from Phase 2
    "RUF",
]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts calls in argument defaults deliberately.
# Without this, B008 fires on every route in the codebase.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# Classic Column() models type as Any. Requiring annotations here buys nothing
# until the models move to SQLAlchemy 2.0 Mapped[] style.
[[tool.mypy.overrides]]
module = "app.database.schemas"
disallow_untyped_defs = false
