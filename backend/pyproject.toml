[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.12",
    "pycrdt>=0.14.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
