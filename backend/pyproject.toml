[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "pycrdt>=0.14.4",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
